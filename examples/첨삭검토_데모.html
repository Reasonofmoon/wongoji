<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원고지 첨삭기 · 교사 검토</title>
<style>
:root{
  --red:#C0392B; --blue:#1F4E79; --ink:#1a1a1a; --mut:#666;
  --line:#e2e0dc; --bg:#faf9f7; --card:#fff; --ok:#2E7D52; --warn:#8B5E34;
  --ui:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--bg);font-size:14px}
.grow{flex:1}

.top{display:flex;align-items:baseline;gap:12px;padding:14px 20px;background:#fff;
     border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:17px;margin:0;letter-spacing:-.02em}
.top .sub{color:var(--mut);font-size:12px}
.stateline{font-size:12px;color:var(--warn);border:1px solid #e8dcc8;background:#FBF7F2;
           padding:4px 10px;border-radius:20px}
.stateline.done{color:var(--ok);border-color:#cfe6d8;background:#f2f9f5}

main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;padding:18px 20px;
     align-items:start}
@media (max-width:1100px){main{grid-template-columns:1fr}}

.sheetpane{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;
      font-size:12px;cursor:pointer;color:#444}
.chip.off{opacity:.38;text-decoration:line-through}
.chip .n{color:var(--mut);margin-left:4px}
.opt{font-size:12px;color:#444;display:flex;align-items:center;gap:5px;cursor:pointer}
.sheetwrap{overflow:auto;border:1px solid #efedea;border-radius:6px;background:#fff}
.sheetwrap svg{display:block;width:100%;height:auto}
.hint{font-size:11.5px;color:var(--mut);margin:9px 2px 0}

/* 부호 상태 */
.mk{cursor:pointer}
.mk .tag circle{transition:r .1s}
.mk[data-state="rejected"]{opacity:.24}
.mk[data-state="rejected"] path{stroke-dasharray:3 3}
.mk[data-state="approved"] path{stroke-width:2.4}
.mk.sel path{stroke:#0B6E4F}
.mk.sel .tag circle{fill:#0B6E4F;stroke:#0B6E4F}
.mk.sel .tag text{fill:#fff}
.mk.hidden{display:none}

.side{display:flex;flex-direction:column;gap:0;background:var(--card);
      border:1px solid var(--line);border-radius:10px;overflow:hidden;
      position:sticky;top:70px;max-height:calc(100vh - 90px)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fcfbfa}
.tab{flex:1;border:0;background:none;padding:11px 6px;font-family:var(--ui);font-size:12.5px;
     cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}
.tab span{display:inline-block;min-width:18px;background:#eee;border-radius:9px;
          font-size:11px;padding:0 5px;color:#555}
.tabpane{display:none;overflow:auto;padding:12px;flex:1}
.tabpane.on{display:block}

.bulk{display:flex;gap:6px;margin-bottom:10px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;
      background:#fff}
.item.sel{border-color:#0B6E4F;box-shadow:0 0 0 2px rgba(11,110,79,.10)}
.item[data-state="approved"]{background:#f6fbf8}
.item[data-state="rejected"]{background:#faf7f7;opacity:.72}
.item .hd{display:flex;align-items:center;gap:7px}
.num{width:19px;height:19px;border-radius:50%;border:1.2px solid var(--red);color:var(--red);
     font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.kind{font-weight:700;font-size:12.5px}
.badge{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:#666}
.badge.rule{background:#eef4fb;border-color:#d6e4f5;color:#2c5d92}
.badge.llm{background:#fdf3ef;border-color:#f5ddd3;color:#a2563a}
.why{font-size:12px;color:#444;margin:6px 0 0;line-height:1.55}
.tgt{font-family:'Nanum Myeongjo',serif;background:#f6f5f3;padding:1px 5px;border-radius:4px}
.acts{display:flex;gap:5px;margin-top:8px}
.btn{font-family:var(--ui);font-size:12px;border:1px solid var(--line);background:#fff;
     border-radius:6px;padding:6px 11px;cursor:pointer;color:#333}
.btn:hover{background:#f6f5f3}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.ghost{color:var(--mut)}
.btn.on-ok{background:#eaf5ef;border-color:#bcdfcc;color:#1d6b47;font-weight:700}
.btn.on-no{background:#f7ecea;border-color:#e6c9c4;color:#983227;font-weight:700}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.edit{width:100%;font-family:var(--ui);font-size:12px;border:1px solid var(--line);
      border-radius:6px;padding:6px;margin-top:7px;resize:vertical}

.gate .item{cursor:default;background:#fbfaf9}
.gate .why{color:#8a4b3f}
.note{font-size:11.5px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.rv{display:block;font-size:12px;font-weight:700;color:var(--warn);margin-bottom:12px}
.rv textarea{display:block;width:100%;margin-top:5px;font-family:var(--ui);font-size:12.5px;
             line-height:1.6;border:1px solid var(--line);border-radius:7px;padding:8px;
             font-weight:400;color:var(--ink);resize:vertical}
.foot{border-top:1px solid var(--line);padding:11px 12px;display:flex;gap:7px;
      align-items:center;flex-wrap:wrap;background:#fcfbfa}
.msg{font-size:11.5px;color:var(--mut);margin:0;flex-basis:100%}

</style>
</head>
<body>
<header class="top">
  <h1>원고지 첨삭기</h1>
  <span class="sub">교사 검토 화면 · 1단계 프로토타입</span>
  <div class="grow"></div>
  <span id="stateline" class="stateline">검토 대기</span>
</header>

<p class="note" style="margin:0 20px 12px;padding:9px 12px;background:#FBF7F2;border:1px solid #e8dcc8;border-radius:8px">정적 데모입니다. 승인·기각·필터·총평 편집은 동작하고, 내보내기는 <code>server.py</code>를 띄운 뒤에 됩니다.</p>
<main>
  <section class="sheetpane">
    <div class="toolbar">
      <div class="chips" id="kindchips"></div>
      <label class="opt"><input type="checkbox" id="hidepending"> 미검토 부호 숨기기</label>
    </div>
    <div class="sheetwrap" id="sheetwrap"></div>
    <p class="hint">부호를 누르면 오른쪽 항목이 선택됩니다. 기각한 항목은 지면에서 흐려지고, 내보낼 때 되살림표로 남습니다.</p>
  </section>

  <aside class="side">
    <div class="tabs">
      <button class="tab on" data-tab="items">교정 항목 <span id="cnt-items">0</span></button>
      <button class="tab" data-tab="gate">게이트 반려 <span id="cnt-gate">0</span></button>
      <button class="tab" data-tab="review">총평</button>
    </div>

    <div class="tabpane on" id="pane-items">
      <div class="bulk">
        <button id="approve-all" class="btn sm">규칙 계층 일괄 승인</button>
        <button id="reset-all" class="btn sm ghost">되돌리기</button>
      </div>
      <ol class="items" id="items"></ol>
    </div>

    <div class="tabpane" id="pane-gate">
      <p class="note">LLM이 냈지만 검증 게이트가 반려한 항목입니다. 학생에게는 보이지 않습니다.</p>
      <ol class="items gate" id="gateitems"></ol>
    </div>

    <div class="tabpane" id="pane-review">
      <label class="rv">잘한 점<textarea id="rv-good" rows="5"></textarea></label>
      <label class="rv">고칠 점<textarea id="rv-fix" rows="5"></textarea></label>
      <label class="rv">다음에 해 볼 것<textarea id="rv-next" rows="5"></textarea></label>
    </div>

    <div class="foot">
      <button id="export-png" class="btn">첨삭본 내보내기</button>
      <button id="return" class="btn primary">학생에게 돌려주기</button>
      <p class="msg" id="msg"></p>
    </div>
  </aside>
</main>

<script>
/* 원고지 첨삭기 — 교사 검토 화면.
   서버가 보낸 SVG(칸 좌표는 파이썬이 계산)를 붙이고, 상태 관리만 담당한다.
   window.__CHUMSAK__ 가 있으면 그것을 쓰고(정적 데모), 없으면 /api/chumsak 을 부른다. */
(function () {
  "use strict";
  var S = { svg: null, data: null, sel: null, hidden: {} };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------------------------------------------------------------- 초기화 */
  function boot(payload) {
    S.svg = payload.svg;
    S.data = payload.data;
    S.gate = payload.gate || [];
    $("sheetwrap").innerHTML = S.svg;
    S.data.corrections.forEach(function (c) { if (!c.state) c.state = "pending"; });
    bindSheet();
    renderChips();
    renderItems();
    renderGate();
    renderReview();
    updateState();
  }

  function bindSheet() {
    Array.prototype.forEach.call(document.querySelectorAll(".mk"), function (g) {
      g.addEventListener("click", function () { select(+g.dataset.n, true); });
    });
  }

  /* ---------------------------------------------------------------- 목록 */
  function itemHTML(c) {
    var src = c.source === "rule" ? "규칙" : "LLM";
    var tgt = c.target ? '<span class="tgt">' + esc(c.target) + "</span>" : "";
    var to = c.text ? ' → <span class="tgt">' + esc(c.text) + "</span>" : "";
    return '<li class="item" data-n="' + c.n + '" data-state="' + c.state + '">' +
      '<div class="hd"><span class="num">' + c.n + "</span>" +
      '<span class="kind">' + esc(c.label) + "</span>" +
      '<span class="badge ' + c.source + '">' + src + "</span>" +
      '<span class="badge">' + esc(c.layer) + "</span></div>" +
      '<p class="why">' + tgt + to + " · " + esc(c.reason) + "</p>" +
      '<div class="acts">' +
      '<button class="btn sm act" data-a="approved">승인</button>' +
      '<button class="btn sm act" data-a="edit">수정</button>' +
      '<button class="btn sm act" data-a="rejected">기각</button></div>' +
      "</li>";
  }

  function renderItems() {
    var box = $("items");
    box.innerHTML = S.data.corrections.map(itemHTML).join("");
    $("cnt-items").textContent = S.data.corrections.length;
    Array.prototype.forEach.call(box.querySelectorAll(".item"), function (li) {
      var n = +li.dataset.n;
      li.addEventListener("click", function (e) {
        if (e.target.classList.contains("act")) return;
        select(n, false);
      });
      Array.prototype.forEach.call(li.querySelectorAll(".act"), function (b) {
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          if (b.dataset.a === "edit") openEdit(li, n);
          else setState(n, b.dataset.a);
        });
      });
    });
    paintButtons();
  }

  function paintButtons() {
    Array.prototype.forEach.call($("items").querySelectorAll(".item"), function (li) {
      var c = find(+li.dataset.n);
      li.dataset.state = c.state;
      Array.prototype.forEach.call(li.querySelectorAll(".act"), function (b) {
        b.classList.remove("on-ok", "on-no");
        if (b.dataset.a === "approved" && c.state === "approved") b.classList.add("on-ok");
        if (b.dataset.a === "rejected" && c.state === "rejected") b.classList.add("on-no");
      });
    });
  }

  function openEdit(li, n) {
    if (li.querySelector(".edit")) return;
    var c = find(n);
    var ta = document.createElement("textarea");
    ta.className = "edit";
    ta.rows = 3;
    ta.value = c.reason;
    ta.addEventListener("click", function (e) { e.stopPropagation(); });
    ta.addEventListener("change", function () {
      c.reason = ta.value;
      c.state = "edited";
      c.source = c.source;
      renderItems();
      select(n, false);
      updateState();
    });
    li.appendChild(ta);
    ta.focus();
  }

  function find(n) {
    return S.data.corrections.filter(function (c) { return c.n === n; })[0];
  }

  /* ---------------------------------------------------------------- 상태 */
  function setState(n, st) {
    var c = find(n);
    c.state = c.state === st ? "pending" : st;
    var g = document.querySelector('.mk[data-n="' + n + '"]');
    if (g) g.dataset.state = c.state;
    paintButtons();
    applyVisibility();
    updateState();
  }

  function select(n, fromSheet) {
    S.sel = n;
    Array.prototype.forEach.call(document.querySelectorAll(".mk"), function (g) {
      g.classList.toggle("sel", +g.dataset.n === n);
    });
    Array.prototype.forEach.call($("items").querySelectorAll(".item"), function (li) {
      var on = +li.dataset.n === n;
      li.classList.toggle("sel", on);
      if (on && fromSheet) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    if (fromSheet) showTab("items");
  }

  function updateState() {
    var cs = S.data.corrections;
    var pend = cs.filter(function (c) { return c.state === "pending"; }).length;
    var el = $("stateline");
    if (pend === 0 && cs.length) {
      el.textContent = "검토 완료 · " + cs.length + "건";
      el.classList.add("done");
    } else {
      el.textContent = "검토 대기 · 남은 " + pend + "건";
      el.classList.remove("done");
    }
    $("return").disabled = pend !== 0;
  }

  /* ---------------------------------------------------------------- 필터 */
  function renderChips() {
    var by = {};
    S.data.corrections.forEach(function (c) {
      by[c.kind] = by[c.kind] || { label: c.label, n: 0 };
      by[c.kind].n++;
    });
    $("kindchips").innerHTML = Object.keys(by).map(function (k) {
      return '<button class="chip" data-kind="' + k + '">' + esc(by[k].label) +
        '<span class="n">' + by[k].n + "</span></button>";
    }).join("");
    Array.prototype.forEach.call($("kindchips").children, function (b) {
      b.addEventListener("click", function () {
        var k = b.dataset.kind;
        S.hidden[k] = !S.hidden[k];
        b.classList.toggle("off", !!S.hidden[k]);
        applyVisibility();
      });
    });
  }

  function applyVisibility() {
    var hidePending = $("hidepending").checked;
    Array.prototype.forEach.call(document.querySelectorAll(".mk"), function (g) {
      var c = find(+g.dataset.n);
      var off = S.hidden[c.kind] || (hidePending && c.state === "pending");
      g.classList.toggle("hidden", !!off);
    });
  }

  /* ---------------------------------------------------------------- 총평·게이트 */
  function renderReview() {
    var r = S.data.review || {};
    $("rv-good").value = r.good || "";
    $("rv-fix").value = r.fix || "";
    $("rv-next").value = r.next || "";
    ["good", "fix", "next"].forEach(function (k) {
      $("rv-" + k).addEventListener("change", function () {
        S.data.review[k] = $("rv-" + k).value;
      });
    });
  }

  function renderGate() {
    $("cnt-gate").textContent = S.gate.length;
    $("gateitems").innerHTML = S.gate.map(function (c, i) {
      return '<li class="item"><div class="hd"><span class="num">–</span>' +
        '<span class="kind">' + esc(c.kind) + "</span>" +
        '<span class="badge llm">LLM</span></div>' +
        '<p class="why"><span class="tgt">' + esc(c.target || "") + "</span> · " +
        esc(c.reason || "") + "</p>" +
        '<p class="why"><b>반려</b> — ' + esc(c.drop_reason || "") + "</p></li>";
    }).join("") || '<p class="note">반려된 항목이 없습니다.</p>';
  }

  function showTab(name) {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.classList.toggle("on", t.dataset.tab === name);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tabpane"), function (p) {
      p.classList.toggle("on", p.id === "pane-" + name);
    });
  }

  /* ---------------------------------------------------------------- 내보내기 */
  function payloadOut(fmt) {
    return {
      text: S.data.meta.text,
      corrections: S.data.corrections.map(function (c) {
        return { kind: c.kind, target: c.target, nth: c.nth, text: c.text,
                 reason: c.reason, layer: c.layer, source: c.source, state: c.state };
      }),
      review: S.data.review,
      format: fmt
    };
  }

  function exportSheet(fmt) {
    if (window.__CHUMSAK__) {
      $("msg").textContent = "정적 데모에서는 내보내기가 동작하지 않습니다. server.py를 실행하세요.";
      return;
    }
    $("msg").textContent = "만드는 중…";
    fetch("/api/export", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payloadOut(fmt)) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $("msg").innerHTML = j.error ? esc(j.error)
          : '완료 — <a href="' + esc(j.url) + '" target="_blank">' + esc(j.url) + "</a>" +
            "  (승인 " + j.approved + "건 · 되살림표 " + j.stet + "건)";
      })
      .catch(function (e) { $("msg").textContent = "실패: " + e; });
  }

  /* ---------------------------------------------------------------- 바인딩 */
  document.addEventListener("DOMContentLoaded", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.addEventListener("click", function () { showTab(t.dataset.tab); });
    });
    $("hidepending").addEventListener("change", applyVisibility);
    $("approve-all").addEventListener("click", function () {
      S.data.corrections.forEach(function (c) {
        if (c.source === "rule" && c.state === "pending") c.state = "approved";
      });
      S.data.corrections.forEach(function (c) {
        var g = document.querySelector('.mk[data-n="' + c.n + '"]');
        if (g) g.dataset.state = c.state;
      });
      paintButtons(); applyVisibility(); updateState();
    });
    $("reset-all").addEventListener("click", function () {
      S.data.corrections.forEach(function (c) { c.state = "pending"; });
      S.data.corrections.forEach(function (c) {
        var g = document.querySelector('.mk[data-n="' + c.n + '"]');
        if (g) g.dataset.state = "pending";
      });
      paintButtons(); applyVisibility(); updateState();
    });
    $("export-png").addEventListener("click", function () { exportSheet("png"); });
    $("return").addEventListener("click", function () { exportSheet("pdf"); });

    if (window.__CHUMSAK__) { boot(window.__CHUMSAK__); return; }
    fetch("/api/session").then(function (r) { return r.json(); }).then(boot)
      .catch(function (e) {
        $("sheetwrap").innerHTML = '<p class="note" style="padding:20px">불러오지 못했습니다: ' +
          esc(e) + "</p>";
      });
  });
})();

</script>
